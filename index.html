<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acronym Annunciator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: a dark glass-cockpit annunciator panel. Mastery = lamp state (dark, amber caution, green on). B612 is the Airbus cockpit-display face. */
  --bg:#070b10; --bezel:#0d141c; --panel:#121b25; --raise:#1a2532; --ink:#e4ebf1; --muted:#8495a7; --line:#223041;
  --lamp-off:#0a1017; --lamp-dim:#33445a;
  --on:#41d67f; --caution:#ffb23f; --warn:#ff5a4f; --mag:#ff4fb0; --cyan:#43c6e6;
  --mono:"B612 Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --body:"B612",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:620px;margin:0 auto;position:relative;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bezel)}
.brand{margin:0;font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.brand span{color:var(--on);text-shadow:0 0 10px rgba(65,214,127,.45)}
.hdr{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hdr b{color:var(--caution);font-weight:700}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}

/* menu */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bezel);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.seg button{border:none;background:none;border-radius:7px;padding:10px 2px;font-size:13px;font-weight:700;color:var(--muted)}
.pc .item.q2{font-size:20px;line-height:1.3}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line);background:var(--bezel);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.tchip[aria-pressed="true"]{color:var(--ink);border-color:var(--mag);background:rgba(255,79,176,.14)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--mag)}
.lede{margin:0;color:var(--muted);font-size:14px}
.grp{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px;display:flex;justify-content:space-between}
.panelgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:row dense;gap:8px;background:var(--bezel);border:1px solid var(--line);border-radius:12px;padding:8px}
.cap{text-align:left;background:linear-gradient(180deg,#0f1720,#0a1016);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-height:80px}
.cap.wide{grid-column:span 2}
.cap .nm{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.07em;color:#6d7f93}
.cap .tp{font-size:12px;color:var(--muted);line-height:1.3}
.cap .st{font-size:13px;letter-spacing:3px;color:var(--lamp-dim);margin-top:auto}
.cap .st i{font-style:normal;color:var(--caution)}
.cap.caution{border-color:rgba(255,178,63,.4)}
.cap.caution .nm{color:var(--caution);text-shadow:0 0 12px rgba(255,178,63,.5)}
.cap.on{border-color:rgba(65,214,127,.45)}
.cap.on .nm{color:var(--on);text-shadow:0 0 12px rgba(65,214,127,.55)}
.cta{width:100%;min-height:54px;border-radius:10px;border:1px solid var(--mag);background:rgba(255,79,176,.14);color:var(--ink);font-weight:700;font-size:16px}
.cta small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--lamp-dim)}
.legend .c::before{background:var(--caution)} .legend .o::before{background:var(--on)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.bignum{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;color:var(--caution);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.quiet{font-size:12px;color:var(--muted)}
.reset{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.reset.armed{border-color:var(--warn);color:var(--warn);font-weight:700}

/* round */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:none;border:none;color:var(--cyan);font-weight:700;padding:6px 2px}
.ttl{font-family:var(--mono);font-weight:700;letter-spacing:.08em;font-size:15px;text-align:center}
.meter{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter b{color:var(--ink)}
.meter .x{color:var(--warn)}
.topic{margin:-8px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.lights{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:var(--bezel);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.lights .gap{width:10px}
.lt{min-width:32px;height:46px;padding:0 4px;display:grid;place-items:center;border-radius:6px;background:var(--lamp-off);border:1px solid #1a2532;font-family:var(--mono);font-weight:700;font-size:20px;color:var(--lamp-dim)}
.lt.on{background:var(--on);border-color:var(--on);color:#03200e;box-shadow:0 0 14px rgba(65,214,127,.45)}
.lt.cur{background:var(--caution);border-color:var(--caution);color:#2a1700;box-shadow:0 0 16px rgba(255,178,63,.55)}
.lt.bad{background:var(--warn);border-color:var(--warn);color:#2a0503}
.last{min-height:22px;text-align:center;font-size:14px;color:var(--on)}
.last b{font-family:var(--mono)}
.ask{margin:0;text-align:center;font-size:15px;color:var(--muted)}
.ask b{font-family:var(--mono);font-size:30px;color:var(--caution);vertical-align:-4px;margin:0 4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.opt.right,.chip.right,.lo.right{border-color:var(--on);background:rgba(65,214,127,.16)}
.opt.wrong,.chip.wrong,.lo.wrong{border-color:var(--warn);background:rgba(255,90,79,.16)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;min-height:46px}
.tb{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.tb span{display:block;height:100%;background:var(--mag)}
.tb.low span{background:var(--warn)}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.pc .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pc .item{font-size:26px;font-weight:700;line-height:1.25;text-wrap:balance}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lo{min-height:78px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.lo .nm{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.05em;color:var(--cyan)}
.lo .tp{font-size:12px;color:var(--muted);line-height:1.3}
.streak{color:var(--mag);font-weight:700}

/* result */
.res{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.stars{font-size:46px;letter-spacing:6px;text-align:center;color:var(--lamp-dim);line-height:1}
.stars i{font-style:normal;color:var(--caution);text-shadow:0 0 14px rgba(255,178,63,.5)}
.res h2{margin:0;text-align:center;font-size:22px;text-wrap:balance}
.res .sub{margin:0;text-align:center;color:var(--muted);font-size:14px}
.newbest{align-self:center;font-family:var(--mono);font-size:12px;letter-spacing:.12em;background:var(--mag);color:#2a0418;border-radius:999px;padding:3px 10px;font-weight:700}
.say{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.say li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline;font-size:15px}
.say li b{font-family:var(--mono);color:var(--on);text-align:right}
.say li.missed b{color:var(--warn)}
.say .word{font-style:normal;font-family:var(--mono);color:var(--caution)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.btn.full{grid-column:span 2}

.hdrwrap{display:flex;align-items:center;gap:10px}
.sound{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:32px;display:grid;place-items:center;color:var(--muted);padding:0}
.sound[aria-pressed="true"]{color:var(--on);border-color:rgba(65,214,127,.45)}
.bonus{font-family:var(--mono);font-weight:700;color:var(--on);opacity:0;margin-right:4px}
.bonus.neg{color:var(--warn)}
.bonus.show{opacity:1}
.banner{text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.08em;color:#2a1700;background:var(--caution);border-radius:8px;padding:7px 10px;box-shadow:0 0 16px rgba(255,178,63,.4)}
.setnm{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.08em;color:var(--cyan)}
.mini{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:2px 0}
.mini .lt{min-width:24px;height:32px;font-size:15px;padding:0 3px;border-radius:4px}
.pc .item b{font-family:var(--mono);color:var(--caution)}
.lopts{display:flex;flex-direction:column;gap:8px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
.rules b{color:var(--ink)}

.credits{margin-top:8px;padding:16px 12px 6px;border-top:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.credits .lamps{display:flex;gap:6px}
.credits .lamps i{width:22px;height:6px;border-radius:2px;background:var(--on);box-shadow:0 0 8px rgba(65,214,127,.6)}
.credits .lamps i:nth-child(2){background:var(--caution);box-shadow:0 0 8px rgba(255,178,63,.6)}
.credits .lamps i:nth-child(3){background:var(--mag);box-shadow:0 0 8px rgba(255,79,176,.6)}
.credits .by{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.credits .by b{color:var(--ink)}
.credits .gl{margin:0;font-size:14px;color:var(--caution)}
.golive{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--caution,#ffb23f);margin:0 0 14px}
.hi .lbbtn{background:none;border:1px solid rgba(255,178,63,.55);border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--caution)}
.hi .hs{display:flex;gap:8px;align-items:baseline}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lb .rk{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--muted);text-align:center}
.lb .cs{font-family:var(--mono);font-weight:700;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .val{font-family:var(--mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.lb li.g1{border-color:rgba(255,201,60,.6)} .lb li.g1 .rk{color:#ffc93c;text-shadow:0 0 10px rgba(255,201,60,.6)}
.lb li.g2 .rk{color:#d6dde5} .lb li.g3 .rk{color:#d08a4a}
.lb li.mine{background:rgba(255,79,176,.10);border-color:var(--mag)}
.lb .del{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:12px;padding:3px 8px}
.lb .del.armed{border-color:var(--warn);color:var(--warn);font-weight:700}
.me .mecs{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--mag)}
.me .stats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.me .stats b{color:var(--ink)}
.me input,.paste{font:inherit;background:var(--bezel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;width:100%}
.me input{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.paste{min-height:96px;font-size:13px;resize:vertical}
.card{margin:0;white-space:pre-wrap;word-break:break-all;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--bezel);border:1px dashed var(--line);border-radius:8px;padding:10px;user-select:all;-webkit-user-select:all}
.note{margin:0;font-size:13px;color:var(--muted)}
.note.ok{color:var(--on)} .note.bad{color:var(--warn)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.sbar{display:flex;align-items:center;justify-content:center;gap:8px;height:30px;flex:0 0 auto;border-radius:999px;border:1px solid var(--line);background:var(--bezel);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--lamp-dim)}
.sbar b{font-size:16px;display:inline-block}
.sbar.warm{color:var(--caution);border-color:rgba(255,178,63,.5)}
.sbar.fire{color:#fff1dc;border-color:#ff7a3a;background:rgba(255,90,30,.22);box-shadow:0 0 16px rgba(255,110,40,.45)}
.sbar.blue{color:#e6fbff;border-color:var(--cyan);background:rgba(67,198,230,.18);box-shadow:0 0 18px rgba(67,198,230,.5)}
.hi{display:flex;justify-content:space-between;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);margin-top:-6px}
.hi b{font-size:18px;color:var(--mag);text-shadow:0 0 10px rgba(255,79,176,.5)}
.callout{position:absolute;left:0;right:0;top:36%;z-index:7;padding:12px 12px 10px;background:rgba(7,11,16,.84);border-top:2px solid currentColor;border-bottom:2px solid currentColor;text-align:center;font-family:var(--mono);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:.06em;color:#ffd27a;text-shadow:0 0 18px rgba(255,130,40,.85),0 3px 0 #5a2400;pointer-events:none;opacity:0}
.callout small{display:block;margin-top:6px;font-size:13px;letter-spacing:.16em;color:var(--ink);text-shadow:none}
.callout.blue{color:#c9f6ff;text-shadow:0 0 20px rgba(67,198,230,.95),0 3px 0 #06303b}
.callout.lost{color:var(--warn);font-size:28px;text-shadow:0 0 14px rgba(255,90,79,.6),0 3px 0 #3a0a08}
.callout.rec{color:var(--mag);text-shadow:0 0 18px rgba(255,79,176,.8),0 3px 0 #3a0624}
.callout.go{animation:callout 1.1s ease-out forwards}
.callout.go.calm{animation:calm 1.1s linear forwards}
@keyframes callout{0%{opacity:0;transform:scale(.3) rotate(-8deg)}14%{opacity:1;transform:scale(1.18) rotate(2deg)}28%{transform:scale(1) rotate(0)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-34px) scale(1.04)}}
@keyframes calm{0%,100%{opacity:0}15%,80%{opacity:1}}
@keyframes quake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes flick{to{transform:scale(1.2)}}

@media (prefers-reduced-motion:no-preference){
  .quake{animation:quake .38s}
  .sbar.fire b,.sbar.blue b{animation:flick .45s ease-in-out infinite alternate}
  .bonus.show{animation:rise .65s ease-out forwards}
  .lt.cur{animation:pulse 1.1s ease-in-out infinite}
  .sweep .lt{animation:lamp .45s ease-out both;animation-delay:calc(var(--i) * 55ms)}
  .shake{animation:shake .3s ease}
  .tb span{transition:width .1s linear}
}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(255,178,63,.2)}}
@keyframes lamp{0%{background:var(--lamp-off);color:var(--lamp-dim);border-color:#1a2532;box-shadow:none}55%{background:#c9ffe0;color:#03200e;box-shadow:0 0 22px rgba(65,214,127,.9)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}25%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 class="brand">Acronym <span>Annunciator</span></h1>
    <div class="hdrwrap">
      <div class="hdr" id="hdr"></div>
      <button class="sound" id="snd" data-act="sound" aria-label="Sound effects" aria-pressed="true"></button>
    </div>
  </header>
  <main id="main"></main>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="callout" id="callout" aria-live="polite"></div>
</div>
<script>
/* Each item: [letter, what it stands for]. breaks = gap before that index. nolight = left out of Lightning. */
const SETS = [
 {id:"grab",name:"GRABCARDD",topic:"IFR equipment · 91.205(d)",items:[["G","Generator / alternator"],["R","Radios & nav equipment"],["A","Altimeter (sensitive)"],["B","Ball (slip-skid indicator)"],["C","Clock (hr, min, sec)"],["A","Attitude indicator"],["R","Rate-of-turn indicator"],["D","Directional gyro"],["D","DME (FL240+ with VORs)"]]},
 {id:"atom",name:"ATOMATOFLAMES",topic:"Day VFR equipment · 91.205(b)",items:[["A","Airspeed indicator"],["T","Tachometer"],["O","Oil pressure gauge"],["M","Manifold pressure gauge"],["A","Altimeter"],["T","Temperature gauge (coolant)"],["O","Oil temperature gauge"],["F","Fuel gauge"],["L","Landing gear position indicator"],["A","Anti-collision lights"],["M","Magnetic compass"],["E","ELT"],["S","Safety belts"]]},
 {id:"flaps",name:"FLAPS",topic:"Night VFR equipment · 91.205(c)",items:[["F","Fuses (spare set)"],["L","Landing light (for hire)"],["A","Anti-collision lights"],["P","Position lights"],["S","Source of electrical power"]]},
 {id:"aviates",name:"AV1ATES",topic:"Required inspections",items:[["A","Airworthiness directives"],["V","VOR check · 30 days"],["1","100-hour (for hire)"],["A","Annual · 12 months"],["T","Transponder · 24 months"],["E","ELT · 12 months"],["S","Static / altimeter · 24 months"]]},
 {id:"hit",name:"6HIT",topic:"IR currency · 61.57(c)",items:[["6","6 instrument approaches"],["H","Holding procedures"],["I","Intercepting courses"],["T","Tracking courses"]]},
 {id:"vdmona",name:"VDMONA",topic:"Compass errors",items:[["V","Variation"],["D","Deviation"],["M","Magnetic dip"],["O","Oscillation"],["N","Northerly turning error"],["A","Acceleration error"]]},
 {id:"unos",name:"UNOS ANDS",topic:"Turning & acceleration errors",breaks:[4],nolight:true,items:[["U","Undershoot"],["N","North"],["O","Overshoot"],["S","South"],["A","Accelerate"],["N","North"],["D","Decelerate"],["S","South"]]},
 {id:"vglad",name:"VGLAD",topic:"VOR receiver checks",items:[["V","VOT · ±4°"],["G","Ground checkpoint · ±4°"],["L","Landmark / airway · ±6°"],["A","Airborne checkpoint · ±6°"],["D","Dual VOR · within 4°"]]},

function mathQ(){
  for(let n=0;n<25;n++){
    const k=pick(["vdpd","vdpt","vs","tod","vsg","slant","ndb"]); let q;
    if(k==="vdpd"){const h=pick([330,360,390,420,450,480,510,540,600,660,720,750]);
      q={src:"Math · VDP by distance",q:`MDH is ${h} ft. How far from the threshold is the VDP?`,a:fNM(h/300),d:[fNM(h/100),fNM(h/200),fNM(h/600)]};}
    else if(k==="vdpt"){const h=pick([400,450,480,500,520,560,600,640,700]),T=pick([180,200,210,225,240,255,270,300]);
      q={src:"Math · VDP by time",q:`MDH ${h} ft, FAF to MAP ${fmtT(T)}. When are you at the VDP (time from the FAF)?`,a:fmtT(T-h/10),d:[fmtT(T-h/5),fmtT(T-h/20),fmtT(T+h/10)]};}
    else if(k==="vs"){const g=pick([70,80,90,100,110,120,130,140,150]);
      q={src:"Math · 3° descent rate",q:`${g} kt groundspeed on a 3° glide path. Descent rate?`,a:`${g*5} fpm`,d:[`${g*10} fpm`,`${g*3} fpm`,`${g*7} fpm`]};}
    else if(k==="tod"){const alt=pick([1500,1800,2400,3000,3600,4500,6000,7500,9000]);
      q={src:"Math · top of descent",q:`You need to lose ${ft(alt)} ft on a 3° path. Start down how far out?`,a:fNM(alt/300),d:[fNM(alt/100),fNM(alt/600),fNM(alt/200)]};}
    else if(k==="vsg"){const [ang,gr]=pick([[2,3.5],[4,7],[5,8.7]]),g=pick([90,100,120,150,180]),r=x=>ft(Math.round(x/10)*10)+" fpm";
      q={src:"Math · steeper and shallower paths",q:`A ${ang}° descent at ${g} kt groundspeed. Descent rate?`,a:r(g*gr),d:[r(g*5),r(g*gr*2),r(g*10)]};}
    else if(k==="slant"){const alt=pick([2000,3000,4000,5000,6000,8000,10000]);
      q={src:"Math · DME slant range",q:`${ft(alt)} ft above the DME station. Slant-range error is negligible beyond…`,a:fNM(alt/1000),d:[fNM(alt/500),fNM(alt/2000),fNM(alt/1000+5)]};}
    else {const mh=pick([30,60,90,120,150,200,240,270,300,330]),rb=pick([30,45,60,90,270,300,315,330]);
      q={src:"Math · NDB bearing",q:`Magnetic heading ${f3(mh)}, relative bearing ${f3(rb)}. Magnetic bearing to the NDB?`,a:f3(mh+rb),d:[f3(mh-rb),f3(mh+rb+180),f3(rb-mh)]};}

  }
  return {gen:true,t:"math",src:"Math · 3° descent rate",q:"100 kt groundspeed on a 3° glide path. Descent rate?",a:"500 fpm",d:["1000 fpm","300 fpm","700 fpm"]};
}

function tone(freq,start,dur,type,vol,slideTo){
  const ac=audio(); if(!ac) return;
  try{
    const t0=ac.currentTime+start, o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.14,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}

}
function streakLabel(n){ return n>=20?machOf(n):n>=16?"MACH 1":n>=12?"AFTERBURNER":n>=8?"UNSTOPPABLE":n>=5?"ON FIRE":n>=3?"HEATING UP":n===2?"COMBO":""; }

const CQ=[]; let cBusy=false;

/* particles: flames rise off the streak bar, sparks burst from the right answer */
const fx={parts:[],run:false,carry:0,last:0,w:0,h:0,dpr:1,ctx:null};
const PAL={fire:[[255,226,150],[255,160,50],[240,80,30],[120,30,20]],blue:[[190,240,255],[80,200,255],[60,100,240],[70,40,150]]};
function fxInit(){ const c=$("fx"); if(!c||!c.getContext) return; fx.ctx=c.getContext("2d"); fxResize(); window.addEventListener("resize",fxResize); }
function fxResize(){ const c=$("fx"), r=$("app").getBoundingClientRect(); fx.dpr=Math.min(2,window.devicePixelRatio||1); fx.w=r.width; fx.h=r.height; c.width=Math.round(r.width*fx.dpr); c.height=Math.round(r.height*fx.dpr); }
function relRect(el){ const a=$("app").getBoundingClientRect(), r=el.getBoundingClientRect(); return {x:r.left-a.left,y:r.top-a.top,w:r.width,h:r.height}; }
function burst(el,pal,count){
  if(REDUCED||!el||!fx.ctx) return;
  const r=relRect(el), cx=r.x+r.w/2, cy=r.y+r.h/2;
  for(let i=0;i<count;i++){ const a=Math.random()*Math.PI*2, sp=80+Math.random()*260;
    fx.parts.push({k:"spark",x:cx+(Math.random()-.5)*r.w*.6,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:0,max:.5+Math.random()*.5,r:1.5+Math.random()*2.5,pal}); }
  fxStart();
}
function smoke(){
  if(REDUCED||!fx.ctx) return; const sb=$("sbar"); if(!sb) return; const r=relRect(sb);
  for(let i=0;i<26;i++) fx.parts.push({k:"smoke",x:r.x+Math.random()*r.w,y:r.y+r.h/2,vx:(Math.random()-.5)*30,vy:-(20+Math.random()*40),life:0,max:.9+Math.random()*.6,r:6+Math.random()*8});

}
function fxStart(){ if(fx.run||!fx.ctx) return; fx.run=true; fx.last=performance.now(); requestAnimationFrame(fxTick); }
function fxTick(t){
  const ctx=fx.ctx, dt=Math.min(.05,Math.max(0,(t-fx.last)/1000)); fx.last=t;
  const n=screen==="round"?comboOf():0, sb=(n>=3&&!REDUCED)?$("sbar"):null;
  if(sb){ const r=relRect(sb), blue=n>=12; fx.carry+=Math.min(130,20+n*6)*dt;
    while(fx.carry>=1&&fx.parts.length<320){ fx.carry--;
      fx.parts.push({k:"flame",x:r.x+14+Math.random()*(r.w-28),y:r.y+3,vx:(Math.random()-.5)*20,vy:-(40+Math.random()*60+Math.min(n,25)*3),life:0,max:.35+Math.random()*.45,r:(2.5+Math.random()*3.5)*(1+Math.min(n,24)/24),pal:blue?"blue":"fire"}); } }
  ctx.setTransform(fx.dpr,0,0,fx.dpr,0,0); ctx.clearRect(0,0,fx.w,fx.h);
  const alive=[];
  for(const p of fx.parts){
    p.life+=dt; if(p.life>=p.max) continue; alive.push(p); const u=p.life/p.max;
    if(p.k==="spark"){ p.vy+=420*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; const c=PAL[p.pal][Math.min(3,Math.floor(u*3))];
      ctx.globalCompositeOperation="lighter"; ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${1-u})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    else if(p.k==="flame"){ p.x+=p.vx*dt+Math.sin((p.life+p.x)*12)*.4; p.y+=p.vy*dt; const c=PAL[p.pal][Math.min(3,Math.floor(u*4))];
      const rr=p.r*(1-u*.55); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${(1-u)*.42})`; ctx.beginPath(); ctx.ellipse(p.x,p.y,rr*.7,rr*1.6,0,0,7); ctx.fill(); }
    else { p.x+=p.vx*dt; p.y+=p.vy*dt; ctx.globalCompositeOperation="source-over"; ctx.fillStyle=`rgba(120,130,140,${(1-u)*.35})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+u),0,7); ctx.fill(); }
  }
  fx.parts=alive; ctx.globalCompositeOperation="source-over";
  if(alive.length||sb) requestAnimationFrame(fxTick); else { fx.run=false; ctx.clearRect(0,0,fx.w,fx.h); }
}

/* ---------- Spell it ---------- */
function spellOptions(set,idx){
  const key = set.list ? (t=>t.toLowerCase()) : norm;
  const [L,T]=set.items[idx]; const seen=new Set([key(T)]); const out=[];
  const take=(arr,max)=>{for(const x of arr){if(out.length>=max)break;const n=key(x.t);if(!seen.has(n)){out.push(x.t);seen.add(n);}}};
  const own=(set.decoys||[]).map(t=>({t,l:t[0].toUpperCase()}));
  const any=shuffle(POOL.filter(x=>x.set!==set));
  if(set.list){
    /* code tiles: the other items in the set, then that set's own wrong answers, then related sets */
    const other=shuffle(set.items.filter((x,j)=>j!==idx).map(x=>({t:x[1]})));
    const rel=shuffle(POOL.filter(x=>x.set&&x.set!==set&&x.set.list&&x.set.grp===set.grp));
    take(other,2); take(shuffle(own),3); take(rel,3); take(any,3);
  } else {
    const same=shuffle(set.items.filter((x,j)=>j!==idx&&x[0]===L).map(x=>({t:x[1]})));
    const ownL=shuffle(own.filter(x=>x.l===L));
    const letter=shuffle(POOL.filter(x=>x.set!==set&&x.l===L));
    const other=shuffle(set.items.filter((x,j)=>j!==idx&&x[0]!==L).map(x=>({t:x[1]})));
    take(same,1); take(ownL,2); take(letter,3); take(same,3); take(other,3); take(any,3);
  }
  return shuffle([T,...out]);
}
function startSpell(set){
  stopTimer();
  R={type:"spell",set,idx:0,miss:0,missed:[],last:"",locked:false,start:Date.now()};
  R.opts=spellOptions(set,0); screen="round"; render();
}
function renderSpell(main){
  const s=R.set, n=s.items.length, L=s.items[R.idx][0];
  main.innerHTML=`
  <div class="top"><button class="back" data-act="menu">‹ Panel</button><div class="ttl">${s.name}</div><div class="meter">Misses <b class="x">${R.miss}</b></div></div>
  ${streakBar()}
  <p class="topic">${s.topic}</p>
  ${lights(s,i=>i<R.idx?"on":i===R.idx?"cur":"")}
  <div class="last">${R.last}</div>
  <p class="ask">${s.list?"Item":"Letter"} ${R.idx+1} of ${n}: <b>${L}</b> ${s.list?"is":"stands for"}…</p>
  <div class="opts">${R.opts.map((t,i)=>`<button class="opt" data-act="pick" data-i="${i}">${t}</button>`).join("")}</div>`;
}
function pickSpell(i,btn){

/* ---------- Lightning ----------
   Clock starts at 45 s (max 60). Every 3 in a row adds time: +3 s at level 1, +2 s at level 2, +1 s after.
   Wrong = −4 s and streak reset. Every 8 right = next level; level 2 adds "Fill the letter", level 3 adds "What comes next".
   Questions come from shuffled decks (no repeats until a deck runs out), never the same acronym twice in a row. */
const L_START=45000, L_MAX=60000, PER_LEVEL=8;
const KINDS={which:"Which acronym?",letter:"Fill the letter",next:"What comes next?",fact:"Quick fact"};
const LETTER_POOL=[]; SETS.forEach(s=>s.items.forEach((_,i)=>LETTER_POOL.push([s,i])));
const NEXT_POOL=[]; SETS.filter(s=>s.id!=="unos").forEach(s=>s.items.forEach((_,i)=>{if(i<s.items.length-1) NEXT_POOL.push([s,i]);}));
function draw(name,src,setOf){
  const b=R.bags;
  if(!b[name]||!b[name].length) b[name]=shuffle(src);
  let x=b[name].pop();
  for(let n=0;n<4&&setOf(x)===R.lastSet&&b[name].length;n++){
    b[name].splice(Math.floor(Math.random()*b[name].length),0,x);
    x=b[name].pop();
  }
  return x;
}
function nextKind(){
  const r=Math.random();
  if(R.level<=1) return r<.3?"fact":"which";
  if(R.level===2) return r<.3?"fact":r<.65?"which":"letter";
  return r<.25?"fact":r<.5?"which":r<.75?"letter":"next";
}
function factOpts(f){return shuffle([f.a,...f.d]);}
function makeQ(){
  const kind=nextKind(); let q;
  if(kind==="fact"){
    const f=Math.random()<.25 ? mathQ() : draw("fact",FACTS,()=>"fact"), opts=factOpts(f);
    q={kind,set:null,src:f.src,text:f.q,opts,ans:opts.indexOf(f.a),miss:`${f.q} → <strong>${f.a}</strong>`};
  } else if(kind==="which"){
    const it=draw("which",LIGHT,x=>x.set);
    const okSets=new Set(SETS.filter(s=>s.items.some(x=>norm(x[1])===norm(it.t))).map(s=>s.id));
    const sets=shuffle([it.set,...shuffle(SETS.filter(s=>!okSets.has(s.id))).slice(0,3)]);
    q={kind,set:it.set,text:it.t,sets,ans:sets.indexOf(it.set),miss:`${it.t} → <strong>${it.set.name}</strong>`};
  } else if(kind==="letter"){
    const [s,i]=draw("letter",LETTER_POOL,x=>x[0]);
    const [L,T]=s.items[i], opts=spellOptions(s,i);
    q={kind,set:s,idx:i,text:`${s.list?"Item":"Letter"} ${i+1}: <b>${L}</b> ${s.list?"is":"stands for"}…`,opts,ans:opts.indexOf(T),miss:`<strong>${s.name}</strong> · ${L} = ${T}`};
  } else {
    const [s,i]=draw("next",NEXT_POOL,x=>x[0]);
    const prev=s.items[i][1], T=s.items[i+1][1], seen=new Set([norm(T),norm(prev)]), out=[];
    const take=arr=>{for(const t of arr){if(out.length>=3)break;const n=norm(t);if(!seen.has(n)){out.push(t);seen.add(n);}}};
    take(shuffle(s.items.filter((_,j)=>j!==i&&j!==i+1).map(x=>x[1])));
    take(shuffle(POOL.filter(x=>x.set!==s&&x.l===s.items[i+1][0]).map(x=>x.t)));
    take(shuffle(POOL.filter(x=>x.set!==s).map(x=>x.t)));
    const opts=shuffle([T,...out]);
    q={kind,set:s,idx:i,text:`After “${prev}” comes…`,opts,ans:opts.indexOf(T),miss:`<strong>${s.name}</strong> · ${prev} → ${T}`};
  }
  R.lastSet=q.set; return q;
}
function startLight(){
  stopTimer();
  R={type:"light",score:0,streak:0,right:0,wrong:0,level:1,misses:[],locked:false,endAt:Date.now()+L_START,bags:{},lastSet:null,ticked:null,banner:"",bannerUntil:0};

}
function lightTick(){
  if(!R||R.type!=="light") return;
  const left=Math.max(0,R.endAt-Date.now()), sec=Math.ceil(left/1000);
  const bar=$("tb"), t=$("tleft");

}
function mult(){return Math.min(4,1+Math.floor(R.streak/5));}
function bonusSecs(){return Math.max(1,4-R.level);}
function renderLight(main){

    : `<div class="lopts">${q.opts.map((t,i)=>`<button class="opt" data-act="lpick" data-i="${i}">${t}</button>`).join("")}</div>`;
  main.innerHTML=`

  ${R.banner?`<div class="banner">${R.banner}</div>`:""}

    ${q.kind==="letter"?`<div class="mini">${q.set.items.map((it,i)=>`<span class="lt${i===q.idx?" cur":""}">${it[0]}</span>`).join("")}</div>`:""}
    <span class="item${q.kind==="fact"?" q2":""}">${q.text}</span></div>
  ${opts}`;
}
function flashBonus(txt,neg){const el=$("bonus"); if(!el) return; el.textContent=txt; el.className="bonus"; void el.offsetWidth; el.className="bonus show"+(neg?" neg":"");}
function pickLight(i,btn){
  if(R.locked) return; R.locked=true;
  const q=R.q, ok=i===q.ans, btns=document.querySelectorAll("[data-act=lpick]");
  let delay=ok?280:1000;
  if(ok){
    R.right++; R.streak++; R.score+=100*R.level*mult(); btn.classList.add("right"); hypeRight(R.streak,btn);
    if(R.streak%3===0){
      const b=bonusSecs(); R.endAt=Math.min(Date.now()+L_MAX,R.endAt+b*1000);
      flashBonus("+"+b+"s",false); setTimeout(()=>SFX.bonus(),110); delay=650;
    }
    if(R.right%PER_LEVEL===0){
      R.level++;
      const msg = R.level===2 ? "Fill the letter unlocked · streak bonus now +2s" : R.level===3 ? "What comes next unlocked · streak bonus now +1s" : `Points ×${R.level} per answer`;
      R.banner=`LEVEL ${R.level} · ${msg}`; R.bannerUntil=R.right+2; setTimeout(()=>SFX.level(),220); delay=Math.max(delay,750);
    }
  } else {
    const lost=R.streak; R.wrong++; R.streak=0; R.endAt-=4000; R.misses.push(q.miss);
    btn.classList.add("wrong","shake"); btns[q.ans].classList.add("right"); hypeWrong(lost); buzz(); flashBonus("−4s",true);
  }
  setTimeout(()=>{
    if(screen!=="round"||!R||R.type!=="light"||!timer) return;
    if(R.banner&&R.right>=R.bannerUntil) R.banner="";
    R.q=makeQ(); R.locked=false; render();
  }, delay);
}

/* ---------- Facts: 12 untimed questions, missed facts first ---------- */
const FACT_N=12;
const FTOPICS=[["all","All"],["ils","ILS & lights"],["nav","Nav aids & GPS"],["proc","Procedures"],["math","Descent math"],["charts","Chart symbols"],["att","Attitude flying"]];
function topicSize(t){ return (t==="all"||t==="math") ? FACT_N : Math.min(FACT_N, FACTS.filter(f=>f.t===t).length); }
function factDeck(t){
  const fm=P.factMiss||{};
  if(t==="math"){ const out=shuffle(FACTS.filter(f=>f.t==="math")).slice(0,3); while(out.length<FACT_N) out.push(mathQ()); return shuffle(out); }
  const src=FACTS.filter(f=>t==="all"||f.t===t);
  const deck=shuffle(src).sort((a,b)=>(fm[b.q]||0)-(fm[a.q]||0)).slice(0, t==="all" ? FACT_N-3 : FACT_N);
  if(t==="all") for(let i=0;i<3;i++) deck.push(mathQ());
  return shuffle(deck);
}
function startFacts(){
  stopTimer();
  const t=P.factTopic||"all", deck=factDeck(t);
  R={type:"facts",topic:t,deck,idx:0,miss:0,missed:[],locked:false,opts:factOpts(deck[0])};

}

}
function pickFact(i,btn){
  if(R.locked) return; R.locked=true;
  const f=R.deck[R.idx], ok=R.opts[i]===f.a; P.factMiss=P.factMiss||{};
  if(ok){btn.classList.add("right"); R.combo=(R.combo||0)+1; hypeRight(R.combo,btn); if(!f.gen&&P.factMiss[f.q]) P.factMiss[f.q]--;}
  else{
    btn.classList.add("wrong","shake"); document.querySelectorAll("[data-act=fpick]")[R.opts.indexOf(f.a)].classList.add("right");
    hypeWrong(R.combo||0); R.combo=0; buzz(); R.miss++; R.missed.push(f); if(!f.gen) P.factMiss[f.q]=(P.factMiss[f.q]||0)+1;
  }

    if(screen!=="round"||!R||R.type!=="facts") return;

    if(R.idx>=R.deck.length) finishRound(); else {R.opts=factOpts(R.deck[R.idx]); render();}
  }, ok?450:1500);
}

/* ---------- Result ---------- */
function finishRound(){
  stopTimer();
  if(R.type==="light"){
    R.newBest = R.score>P.best; if(R.newBest) P.best=R.score;
    if(R.level>P.bestLevel) P.bestLevel=R.level;
  } else if(R.type==="facts"){
    const sc=R.deck.length-R.miss, prev=P.factsBestBy[R.topic]||0; R.stars = R.miss===0?3 : R.miss<=2?2:1;
    R.newBest = sc>prev; P.factsBestBy[R.topic]=Math.max(prev,sc);
  } else {
    const n=R.set.items.length; R.secs=(Date.now()-R.start)/1000;
    if(R.type==="spell") R.stars = R.miss===0?3 : R.miss<=Math.max(1,Math.round(n*.15))?2:1;
    else R.stars = (R.miss===0&&R.secs<=n*3)?3 : R.miss<=1?2:1;
    const prev=starsOf(R.type,R.set.id); R.improved=R.stars>prev;
    P.stars[R.type][R.set.id]=Math.max(prev,R.stars);
  }
  save(); screen="result"; render(); maybePost();
  if(R.type==="spell"||R.type==="order"){
    const n=R.set.items.length; SFX.sweep(n);
    if(R.stars===3) setTimeout(()=>SFX.star(), n*55+120);
  } else if(R.type==="facts"){ if(R.stars===3) SFX.star(); else SFX.over(); }
}

/* ---------- Leaderboard: shared board in db. Org members post live; others send a score card the owner approves. ---------- */
const MAXSTARS=SETS.length*6;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(v,max)=>{ v=Number(v); return Number.isFinite(v)&&v>=0 ? Math.min(Math.floor(v),max) : 0; };
const cleanCS=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9 -]/g,"").replace(/\s+/g," ").trim().slice(0,12);
function totalStars(){ return SETS.reduce((a,s)=>a+starsOf("spell",s.id)+starsOf("order",s.id),0); }
function myStats(){ return {light:P.best||0,streak:P.bestStreak||0,stars:totalStars(),level:P.bestLevel||0}; }
const LIVE_URL="https://claude.ai/artifact/YGw3nSiJB5bEwQDdAp8EnP";
const onClaude=()=>!!(window.claude&&typeof window.claude.use==="function");
let DB=null, UID=null, OWNER=false, BOARD=null, boardLoading=true, boardErr="", canDirect=null, posting=false;
let adminMsg="", copyMsg="", csErr="", delArm=null, draftCS="", draftPaste="", editCS=false;
function hash6(str){ let h=2166136261>>>0; const s2=str+"|dynasty-ir"; for(let i=0;i<s2.length;i++){ h^=s2.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(16).padStart(8,"0").slice(0,6); }
function cardCode(){ const st=myStats(); const b=btoa(unescape(encodeURIComponent(JSON.stringify({c:P.callsign,l:st.light,s:st.streak,t:st.stars,v:st.level})))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); return "AA1."+b+"."+hash6(b); }
function cardText(){ const st=myStats(); return `Acronym Annunciator score card\n${P.callsign} · Lightning ${st.light} · Hi-streak ${st.streak} · Stars ${st.stars}/${MAXSTARS}\n${cardCode()}`; }
function parseCards(text){
  const out=[], re=/AA1\.([A-Za-z0-9_-]+)\.([0-9a-f]{6})/g; let m;
  while((m=re.exec(text))){
    if(hash6(m[1])!==m[2]){ out.push({bad:true}); continue; }
    try{ out.push(JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))))); }catch(e){ out.push({bad:true}); }
  }
  return out;
}
function mergedBoard(){
  const m=new Map();
  for(const d of BOARD||[]){
    const cs=cleanCS(d.callsign); if(!cs) continue;
    const r=m.get(cs)||{cs,light:0,streak:0,stars:0,level:0,ids:[]};
    r.light=Math.max(r.light,num(d.light,1e7)); r.streak=Math.max(r.streak,num(d.streak,1e4)); r.stars=Math.max(r.stars,num(d.stars,MAXSTARS)); r.level=Math.max(r.level,num(d.level,1e3));
    r.ids.push(d.id); m.set(cs,r);
  }
  return [...m.values()];
}
function renderIfBoard(){ if(screen==="board") render(); }
async function initBoard(){
  const cl=window.claude;
  if(!cl||typeof cl.use!=="function"){ boardLoading=false; renderIfBoard(); return; }
  try{ DB=await cl.use("db"); }catch(e){ DB=null; }
  let U=null; try{ U=await cl.use("user"); }catch(e){ U=null; }
  if(U){ try{ OWNER=!!(await U.isOwner()); }catch(e){} try{ UID=await U.id(); }catch(e){ UID=null; } }
  if(!DB){ boardLoading=false; renderIfBoard(); return; }
  const timer=setTimeout(()=>{ if(boardLoading){ boardLoading=false; boardErr="The board can’t be reached yet. It will appear when the connection comes back."; renderIfBoard(); } },10000);
  try{
    DB.collection("board").limit(500).onSnapshot(snap=>{
      BOARD=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));
      if(!snap.metadata.fromCache){ clearTimeout(timer); boardLoading=false; boardErr=""; }
      renderIfBoard();
    }, e=>{ clearTimeout(timer); boardLoading=false; boardErr=(e&&e.code==="revoked")?"":"The board isn’t available right now."; renderIfBoard(); });
  }catch(e){ clearTimeout(timer); boardLoading=false; boardErr="The board isn’t available right now."; }
  maybePost();
}
async function maybePost(){
  if(!DB||!UID||!P.callsign||canDirect===false||posting) return;
  const st=myStats(), body={callsign:P.callsign,light:st.light,streak:st.streak,stars:st.stars,level:st.level};
  const sig=JSON.stringify(body); if(sig===P.postedSig&&canDirect) return;
  posting=true;
  try{ await DB.doc("board/"+UID).set(Object.assign({},body,{kind:"live",updated:new Date().toISOString()})); P.postedSig=sig; canDirect=true; save(); }
  catch(e){ canDirect=false; }
  posting=false; renderIfBoard();
}
let csWarned="";
async function saveCallsign(){
  const cs=cleanCS(draftCS);
  if(cs.length<2){ csErr="Use 2–12 letters or numbers."; render(); return; }
  const taken=mergedBoard().find(r=>r.cs===cs);
  if(taken&&cs!==P.callsign&&!(UID&&taken.ids.includes(UID))&&csWarned!==cs){ csWarned=cs; csErr=`${cs} is already on the board. If that’s you, tap Save again; otherwise pick another.`; render(); return; }
  P.callsign=cs; P.postedSig=""; csErr=""; editCS=false; draftCS=""; save(); render(); maybePost();
}
async function copyCard(){

}
async function addCards(){
  const cards=parseCards(draftPaste); let ok=0,bad=0; const names=[];
  if(!cards.length){ adminMsg="No score cards found. Paste the whole message, including the AA1 code."; render(); return; }
  for(const c of cards){
    if(c.bad){ bad++; continue; }
    const cs=cleanCS(c.c); if(cs.length<2){ bad++; continue; }
    const id="c-"+cs.replace(/ /g,"_"), prev=(BOARD||[]).find(d=>d.id===id)||{};
    const body={callsign:cs,light:Math.max(num(c.l,1e7),num(prev.light,1e7)),streak:Math.max(num(c.s,1e4),num(prev.streak,1e4)),stars:Math.max(num(c.t,MAXSTARS),num(prev.stars,MAXSTARS)),level:Math.max(num(c.v,1e3),num(prev.level,1e3)),kind:"card",updated:new Date().toISOString()};
    try{ await DB.doc("board/"+id).set(body); ok++; names.push(cs); }catch(e){ bad++; }
  }
  adminMsg=`Added ${ok} card${ok===1?"":"s"}${names.length?": "+names.join(", "):""}${bad?` · ${bad} couldn’t be read`:""}.`;
  if(ok) draftPaste="";
  render();
}

  else renderLight(main);
  const tot=m=>SETS.reduce((a,s)=>a+starsOf(m,s.id),0);
  $("hdr").innerHTML = mode==="light" ? `Best <b>${P.best}</b>` : mode==="facts" ? `Best <b>${P.factsBestBy[P.factTopic]||0}</b>/${topicSize(P.factTopic)}` : `<b>★ ${tot(mode)}</b>/${SETS.length*3}`;
  soundIcon();
  if(screen==="round"&&comboOf()>=3) fxStart();
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  audio(); /* unlock Web Audio inside a tap, as browsers require */
  if(a==="sound"){P.sound=!P.sound; save(); soundIcon(); if(P.sound) SFX.right(); return;}
  if(a!=="reset") resetArm=false;
  if(a==="mode"){mode=el.dataset.m;render();}
  else if(a==="play"){const s=BYID[el.dataset.id]; mode==="order"?startOrder(s):startSpell(s); $("main").scrollTop=0;}
  else if(a==="light") startLight();
  else if(a==="facts") startFacts();
  else if(a==="board"){ stopTimer(); R=null; screen="board"; render(); $("main").scrollTop=0; }
  else if(a==="lbtab"){ P.lbTab=el.dataset.t; save(); render(); }
  else if(a==="savecs") saveCallsign();
  else if(a==="editcs"){ editCS=true; draftCS=P.callsign||""; csErr=""; render(); }
  else if(a==="canceledit"){ editCS=false; draftCS=""; csErr=""; render(); }
  else if(a==="copycard") copyCard();
  else if(a==="addcards") addCards();
  else if(a==="lbdel") delEntry(el.dataset.cs);
  else if(a==="ftopic"){P.factTopic=el.dataset.t; save(); render();}
  else if(a==="pick") pickSpell(+el.dataset.i,el);
  else if(a==="chip") tapChip(+el.dataset.k,el);
  else if(a==="lpick") pickLight(+el.dataset.i,el);
  else if(a==="fpick") pickFact(+el.dataset.i,el);
  else if(a==="again"){ if(R.type==="light") startLight(); else if(R.type==="facts") startFacts(); else if(R.type==="order") startOrder(R.set); else startSpell(R.set); }
  else if(a==="menu"){stopTimer(); screen="menu"; R=null; render(); $("main").scrollTop=0;}
  else if(a==="reset"){ if(!resetArm){resetArm=true;render();} else {P={stars:{spell:{},order:{}},best:0,bestLevel:0,factsBestBy:{},factTopic:P.factTopic||"all",factMiss:{},sound:P.sound};resetArm=false;save();render();} }
});
document.addEventListener("input",e=>{ if(e.target.id==="cs"){ draftCS=e.target.value; csErr=""; } else if(e.target.id==="paste") draftPaste=e.target.value; });
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target&&e.target.id==="cs"){ e.preventDefault(); saveCallsign(); return; }
  if(screen!=="round"||!R) return;
  const n=parseInt(e.key,10);
  if(R.type==="spell"&&n>=1&&n<=4){const b=document.querySelectorAll(".opt")[n-1]; if(b) pickSpell(n-1,b);}
  if(R.type==="light"&&n>=1&&n<=4){audio(); const b=document.querySelectorAll("[data-act=lpick]")[n-1]; if(b) pickLight(n-1,b);}
  if(R.type==="facts"&&n>=1&&n<=4){audio(); const b=document.querySelectorAll("[data-act=fpick]")[n-1]; if(b) pickFact(n-1,b);}
  if(e.key==="Escape"){stopTimer();screen="menu";R=null;render();}
});

function start(data){ if(data&&["spell","order","light","facts"].includes(data.mode)) mode=data.mode; fxInit(); render(); initBoard(); }
window.claude?.hot?.snapshot(() => ({mode}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
